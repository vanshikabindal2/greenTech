<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle -->
  <defs>
    <radialGradient id="leafGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#7cb342;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1b5e20;stop-opacity:1" />
    </radialGradient>
  </defs>
  
  <!-- Leaves arranged in a circle -->
  <!-- Top center leaf -->
  <path d="M 100 20 Q 105 40 103 60 Q 100 70 97 60 Q 95 40 100 20" fill="#1b5e20" stroke="#c8e6c9" stroke-width="1.5"/>
  <line x1="100" y1="25" x2="100" y2="65" stroke="#c8e6c9" stroke-width="0.8" opacity="0.6"/>
  
  <!-- Top right leaf -->
  <path d="M 135 35 Q 142 48 140 65 Q 135 72 130 60 Q 127 45 135 35" fill="#2e7d32" stroke="#c8e6c9" stroke-width="1.5" transform="rotate(60 135 50)"/>
  <line x1="135" y1="38" x2="135" y2="68" stroke="#c8e6c9" stroke-width="0.8" opacity="0.6" transform="rotate(60 135 50)"/>
  
  <!-- Right leaf -->
  <path d="M 165 70 Q 172 80 168 100 Q 160 108 155 90 Q 155 75 165 70" fill="#1b5e20" stroke="#c8e6c9" stroke-width="1.5" transform="rotate(120 165 85)"/>
  <line x1="165" y1="72" x2="165" y2="105" stroke="#c8e6c9" stroke-width="0.8" opacity="0.6" transform="rotate(120 165 85)"/>
  
  <!-- Bottom right leaf -->
  <path d="M 150 140 Q 152 155 140 165 Q 130 165 127 150 Q 135 140 150 140" fill="#2e7d32" stroke="#c8e6c9" stroke-width="1.5" transform="rotate(180 145 155)"/>
  <line x1="145" y1="142" x2="145" y2="170" stroke="#c8e6c9" stroke-width="0.8" opacity="0.6" transform="rotate(180 145 155)"/>
  
  <!-- Bottom left leaf -->
  <path d="M 65 165 Q 58 155 62 140 Q 72 135 75 150 Q 70 160 65 165" fill="#1b5e20" stroke="#c8e6c9" stroke-width="1.5" transform="rotate(-60 65 150)"/>
  <line x1="65" y1="168" x2="65" y2="135" stroke="#c8e6c9" stroke-width="0.8" opacity="0.6" transform="rotate(-60 65 150)"/>
  
  <!-- Left leaf -->
  <path d="M 35 100 Q 28 90 32 70 Q 40 62 45 80 Q 45 95 35 100" fill="#2e7d32" stroke="#c8e6c9" stroke-width="1.5" transform="rotate(-120 35 85)"/>
  <line x1="35" y1="102" x2="35" y2="70" stroke="#c8e6c9" stroke-width="0.8" opacity="0.6" transform="rotate(-120 35 85)"/>
  
  <!-- Top left leaf -->
  <path d="M 65 35 Q 58 48 60 65 Q 65 72 70 60 Q 73 45 65 35" fill="#1b5e20" stroke="#c8e6c9" stroke-width="1.5" transform="rotate(-60 65 50)"/>
  <line x1="65" y1="38" x2="65" y2="68" stroke="#c8e6c9" stroke-width="0.8" opacity="0.6" transform="rotate(-60 65 50)"/>
  
  <!-- Inner leaves for fuller look -->
  <path d="M 100 50 Q 105 60 102 75 Q 98 80 95 70 Q 95 58 100 50" fill="#43a047" stroke="#c8e6c9" stroke-width="1"/>
  <path d="M 130 80 Q 135 88 132 103 Q 127 108 123 95 Q 125 83 130 80" fill="#43a047" stroke="#c8e6c9" stroke-width="1"/>
  <path d="M 120 120 Q 122 132 110 140 Q 103 138 105 125 Q 112 118 120 120" fill="#43a047" stroke="#c8e6c9" stroke-width="1"/>
  <path d="M 80 125 Q 78 137 65 138 Q 60 133 68 122 Q 75 118 80 125" fill="#43a047" stroke="#c8e6c9" stroke-width="1"/>
  <path d="M 70 90 Q 65 98 53 98 Q 50 90 63 85 Q 70 84 70 90" fill="#43a047" stroke="#c8e6c9" stroke-width="1"/>
  
  <!-- GTS Text with moon/curve design -->
  <!-- Crescent moon shape -->
  <path d="M 70 100 Q 80 90 85 100 Q 80 110 70 100" fill="#a5d6a7" stroke="#c8e6c9" stroke-width="1.5"/>
  
  <!-- GTS text -->
  <text x="100" y="115" font-family="Georgia, serif" font-size="42" font-weight="bold" fill="#c8e6c9" text-anchor="middle" letter-spacing="2">GTS</text>
</svg>